<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalis — Cybersecurity Trend Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E14;
    --panel: #0F1621;
    --panel-raised: #141D2B;
    --line: #1E293B;
    --text: #E4E9F2;
    --muted: #8B95A7;
    --dim: #566178;
    --signal: #00D9A3;
    --signal-dim: #00D9A322;
    --risk: #FF5C5C;
    --risk-dim: #FF5C5C22;
    --cool: #5B7FFF;
    --cool-dim: #5B7FFF22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 15% 10%, #0F1B2A 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #0D1A22 0%, transparent 40%);
  }

  ::selection { background: var(--signal-dim); color: var(--signal); }

  /* ---------- Header ---------- */
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px;
    border-bottom: 1px solid var(--line);
    background: rgba(15,22,33,0.6);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand{ display:flex; align-items:center; gap:12px; }

  .brand-mark{
    width: 34px; height: 34px;
    border: 1.5px solid var(--signal);
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark::before{
    content:'';
    position:absolute; inset:8px;
    border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 12px 2px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.5; transform:scale(.7); }
  }

  .brand-text h1{
    font-size: 16px;
    letter-spacing: 0.02em;
    font-weight: 700;
  }
  .brand-text p{
    font-size: 11.5px;
    color: var(--muted);
    font-family:'JetBrains Mono', monospace;
    letter-spacing: 0.03em;
    margin-top: 1px;
  }

  .status-pill{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 14px;
    display:flex; align-items:center; gap:8px;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--dim);
  }
  .status-pill.live .status-dot{ background: var(--signal); box-shadow:0 0 6px var(--signal); }
  .status-pill.live{ color: var(--signal); border-color: #00D9A344; }
  .status-pill.synthetic .status-dot{ background: var(--cool); box-shadow:0 0 6px var(--cool); }
  .status-pill.synthetic{ color: var(--cool); border-color: #5B7FFF44; }

  /* ---------- Layout ---------- */
  .layout{
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1px;
    background: var(--line);
    min-height: calc(100vh - 78px);
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar: categorie-lijst ---------- */
  .sidebar{
    background: var(--panel);
    padding: 20px 0;
    overflow-y: auto;
  }
  .sidebar-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: 0.12em;
    padding: 0 20px 14px;
    text-transform: uppercase;
  }
  .cat-item{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .cat-item:hover{ background: var(--panel-raised); }
  .cat-item.active{
    background: var(--panel-raised);
    border-left-color: var(--signal);
  }
  .cat-name{
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
  }
  .cat-item.active .cat-name{ color: var(--signal); }
  .cat-momentum{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 10px;
  }
  .mom-stijgend{ background: var(--signal-dim); color: var(--signal); }
  .mom-dalend{ background: var(--risk-dim); color: var(--risk); }
  .mom-stabiel{ background: var(--cool-dim); color: var(--cool); }

  /* ---------- Main panel ---------- */
  .main{ background: var(--bg); padding: 32px; }

  .panel-header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
  }
  .panel-title h2{
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
  }
  .panel-title p{
    font-size: 13px; color: var(--muted); margin-top: 4px;
  }

  .horizon-control{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; color: var(--muted);
  }
  .horizon-control input[type=range]{
    width: 140px; accent-color: var(--signal);
  }
  .horizon-value{ color: var(--signal); font-weight:600; min-width: 62px; }

  /* ---------- Stat strip ---------- */
  .stat-strip{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .stat{ background: var(--panel); padding: 16px 20px; }
  .stat-label{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px; color: var(--dim); letter-spacing:.08em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .stat-value{
    font-family:'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 700;
  }
  .stat-value.signal{ color: var(--signal); }
  .stat-value.risk{ color: var(--risk); }
  .stat-value.cool{ color: var(--cool); }
  .stat-sub{ font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* confidence bar */
  .confidence-track{
    height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow:hidden;
  }
  .confidence-fill{
    height: 100%; background: linear-gradient(90deg, var(--cool), var(--signal));
    border-radius: 2px; transition: width .4s ease;
  }

  /* ---------- Chart panel ---------- */
  .chart-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
  }
  .chart-legend{
    display:flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap;
    font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
  }
  .legend-item{ display:flex; align-items:center; gap:7px; }
  .legend-swatch{ width:14px; height:2px; border-radius:1px; }

  svg{ width: 100%; height: auto; display:block; }
  .grid-line{ stroke: var(--line); stroke-width: 1; }
  .axis-label{ fill: var(--dim); font-family:'JetBrains Mono', monospace; font-size: 10px; }
  .history-line{ fill:none; stroke: var(--cool); stroke-width: 2; }
  .forecast-line{ fill:none; stroke: var(--signal); stroke-width: 2; stroke-dasharray: 5 4; }
  .forecast-band{ fill: var(--signal); opacity: 0.09; }
  .now-marker{ stroke: var(--dim); stroke-width: 1; stroke-dasharray: 2 3; }
  .now-label{ fill: var(--muted); font-family:'JetBrains Mono', monospace; font-size: 10px; }
  .dot-history{ fill: var(--cool); }
  .dot-forecast{ fill: var(--bg); stroke: var(--signal); stroke-width: 1.5; }

  /* ---------- Footer note ---------- */
  .method-note{
    margin-top: 24px;
    padding: 16px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--cool);
    border-radius: 0 8px 8px 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
  }
  .method-note strong{ color: var(--text); }

  /* ---------- Loading / empty ---------- */
  .loading{
    display:flex; align-items:center; justify-content:center;
    height: 300px; color: var(--dim); font-family:'JetBrains Mono', monospace; font-size: 13px;
    gap: 10px;
  }
  .spinner{
    width:14px; height:14px; border-radius:50%;
    border: 2px solid var(--line); border-top-color: var(--signal);
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .error-box{
    padding: 16px 20px; background: var(--risk-dim); border: 1px solid #FF5C5C44;
    border-radius: 8px; color: var(--risk); font-size: 13px; line-height: 1.6;
  }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce){
    .brand-mark::before{ animation:none; }
    .spinner{ animation: none; }
  }

  button:focus-visible, input:focus-visible, .cat-item:focus-visible{
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <h1>SIGNALIS</h1>
      <p>CYBERSECURITY TREND PREDICTOR</p>
    </div>
  </div>
  <div id="statusPill" class="status-pill">
    <span class="status-dot"></span>
    <span id="statusText">verbinden…</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Tool-categorieën</div>
    <div id="categoryList"></div>
  </aside>

  <main class="main">
    <div class="panel-header">
      <div class="panel-title">
        <h2 id="panelTitle">—</h2>
        <p id="panelSubtitle">Historische data en geprojecteerde ontwikkeling</p>
      </div>
      <div class="horizon-control">
        <span>HORIZON</span>
        <input type="range" id="horizonSlider" min="3" max="24" step="1" value="12">
        <span class="horizon-value" id="horizonValue">12 mnd</span>
      </div>
    </div>

    <div id="content">
      <div class="loading"><span class="spinner"></span> data laden…</div>
    </div>
  </main>
</div>

<script>
// Alles draait achter dezelfde poort (4444): frontend onder /app/, API onder
// /api/*. Een leeg API_BASE ('') maakt fetch('/api/...') automatisch relatief
// aan de huidige host — werkt dus lokaal én op elke server zonder aanpassing.
const API_BASE = window.SIGNALIS_API_BASE ?? '';

let categories = [];
let activeCategory = null;
let horizon = 12;
let currentSource = null;

const el = {
  categoryList: document.getElementById('categoryList'),
  content: document.getElementById('content'),
  panelTitle: document.getElementById('panelTitle'),
  panelSubtitle: document.getElementById('panelSubtitle'),
  statusPill: document.getElementById('statusPill'),
  statusText: document.getElementById('statusText'),
  horizonSlider: document.getElementById('horizonSlider'),
  horizonValue: document.getElementById('horizonValue'),
};

el.horizonSlider.addEventListener('input', (e) => {
  horizon = parseInt(e.target.value, 10);
  el.horizonValue.textContent = `${horizon} mnd`;
  if (activeCategory) loadPrediction(activeCategory);
});

function setStatus(state, text) {
  el.statusPill.className = `status-pill ${state}`;
  el.statusText.textContent = text;
}

async function fetchJSON(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

async function init() {
  try {
    categories = await fetchJSON('/api/categories');
    renderCategoryList();
    if (categories.length) {
      selectCategory(categories[0].key);
    }
  } catch (err) {
    setStatus('synthetic', 'backend onbereikbaar');
    el.content.innerHTML = `
      <div class="error-box">
        <strong>Kan geen verbinding maken met de backend</strong> (${API_BASE}).<br><br>
        Start de volledige stack met <code>./deploy.sh</code>, of handmatig:<br>
        <code>cd backend && uvicorn main:app --host 0.0.0.0 --port 4444</code><br><br>
        Draait de backend op een andere host/poort dan waar deze pagina vandaan komt?
        Zet dit vóór het app-script in <code>index.html</code>:<br>
        <code>&lt;script&gt;window.SIGNALIS_API_BASE = "http://jouw-adres:4444";&lt;/script&gt;</code>
      </div>`;
  }
}

function renderCategoryList() {
  el.categoryList.innerHTML = categories.map(c => `
    <div class="cat-item" data-key="${c.key}" tabindex="0" role="button">
      <span class="cat-name">${c.label}</span>
      <span class="cat-momentum" data-momentum-for="${c.key}">···</span>
    </div>
  `).join('');

  el.categoryList.querySelectorAll('.cat-item').forEach(item => {
    item.addEventListener('click', () => selectCategory(item.dataset.key));
    item.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') selectCategory(item.dataset.key);
    });
  });
}

function selectCategory(key) {
  activeCategory = key;
  el.categoryList.querySelectorAll('.cat-item').forEach(item => {
    item.classList.toggle('active', item.dataset.key === key);
  });
  loadPrediction(key);
}

async function loadPrediction(key) {
  el.content.innerHTML = `<div class="loading"><span class="spinner"></span> voorspelling berekenen…</div>`;
  try {
    const data = await fetchJSON(`/api/predict/${key}?horizon=${horizon}`);
    currentSource = data.source;
    setStatus(
      data.source === 'live-nvd' ? 'live' : 'synthetic',
      data.source === 'live-nvd' ? 'live NVD-data' : 'synthetische data'
    );
    updateMomentumBadge(key, data.momentum);
    renderPrediction(data);
  } catch (err) {
    el.content.innerHTML = `<div class="error-box"><strong>Voorspelling mislukt:</strong> ${err.message}</div>`;
  }
}

function updateMomentumBadge(key, momentum) {
  const badge = document.querySelector(`[data-momentum-for="${key}"]`);
  if (!badge) return;
  badge.textContent = momentum;
  badge.className = `cat-momentum mom-${momentum}`;
}

function renderPrediction(data) {
  const cat = categories.find(c => c.key === data.category);
  el.panelTitle.textContent = cat ? cat.label : data.category;
  el.panelSubtitle.textContent = `${data.history.length} maanden historie → ${data.forecast.length} maanden projectie`;

  const lastHistory = data.history[data.history.length - 1].value;
  const lastForecast = data.forecast[data.forecast.length - 1].value;
  const pctChange = lastHistory > 0 ? (((lastForecast - lastHistory) / lastHistory) * 100).toFixed(0) : '—';
  const trendClass = data.momentum === 'stijgend' ? 'signal' : (data.momentum === 'dalend' ? 'risk' : 'cool');

  el.content.innerHTML = `
    <div class="stat-strip">
      <div class="stat">
        <div class="stat-label">Momentum</div>
        <div class="stat-value ${trendClass}">${data.momentum.toUpperCase()}</div>
        <div class="stat-sub">${data.slope_per_month > 0 ? '+' : ''}${data.slope_per_month} punten / maand</div>
      </div>
      <div class="stat">
        <div class="stat-label">Geprojecteerde verandering</div>
        <div class="stat-value ${trendClass}">${pctChange > 0 ? '+' : ''}${pctChange}%</div>
        <div class="stat-sub">over ${data.forecast.length} maanden</div>
      </div>
      <div class="stat">
        <div class="stat-label">Modelvertrouwen</div>
        <div class="stat-value">${Math.round(data.confidence * 100)}%</div>
        <div class="confidence-track"><div class="confidence-fill" style="width:${data.confidence * 100}%"></div></div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="chart-legend">
        <div class="legend-item"><span class="legend-swatch" style="background:var(--cool)"></span> Historisch gedrag</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--signal);background-image:repeating-linear-gradient(90deg,var(--signal) 0 6px,transparent 6px 10px)"></span> Voorspelling</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--signal);opacity:.3"></span> Onzekerheidsband (~80%)</div>
      </div>
      ${renderChart(data)}
    </div>

    <div class="method-note">
      <strong>Interpretatie:</strong> dit voorspelt geen individuele gebeurtenissen, maar extrapoleert
      <strong>collectief, historisch stabiel gedrag</strong> — publicatieritme, seizoenspatronen en
      adoptiesnelheid. Zulk aggregaatgedrag is aanzienlijk voorspelbaarder dan individuele beslissingen.
      Bron: <strong>${currentSource === 'live-nvd' ? 'live NVD-kwetsbaarhedendata' : 'synthetisch gemodelleerd (fallback — backend kon geen live data ophalen)'}</strong>.
      Behandel dit als scenarioverkenning, niet als garantie.
    </div>
  `;
}

function renderChart(data) {
  const W = 900, H = 320, padL = 46, padR = 20, padT = 20, padB = 30;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const allPoints = [
    ...data.history.map(p => ({ ...p, kind: 'history' })),
    ...data.forecast.map(p => ({ ...p, kind: 'forecast' })),
  ];

  const allValues = allPoints.flatMap(p => [p.value, p.lower ?? p.value, p.upper ?? p.value]);
  const maxV = Math.max(...allValues) * 1.12;
  const minV = 0;

  const n = allPoints.length;
  const xFor = (i) => padL + (i / (n - 1)) * innerW;
  const yFor = (v) => padT + innerH - ((v - minV) / (maxV - minV || 1)) * innerH;

  const historyCount = data.history.length;

  // Lines
  const historyPath = data.history.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i)} ${yFor(p.value)}`).join(' ');

  const forecastStartIdx = historyCount - 1;
  const forecastPath = [
    `M ${xFor(forecastStartIdx)} ${yFor(data.history[historyCount - 1].value)}`,
    ...data.forecast.map((p, i) => `L ${xFor(forecastStartIdx + 1 + i)} ${yFor(p.value)}`)
  ].join(' ');

  const bandTop = [
    `M ${xFor(forecastStartIdx)} ${yFor(data.history[historyCount - 1].value)}`,
    ...data.forecast.map((p, i) => `L ${xFor(forecastStartIdx + 1 + i)} ${yFor(p.upper)}`)
  ];
  const bandBottom = data.forecast.map((p, i) => `L ${xFor(forecastStartIdx + 1 + data.forecast.length - 1 - i)} ${yFor(data.forecast[data.forecast.length - 1 - i].lower)}`);
  const bandPath = [...bandTop, ...bandBottom, 'Z'].join(' ');

  // Grid lines (4 horizontal)
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(t => {
    const y = padT + innerH * t;
    const val = Math.round(maxV * (1 - t));
    return `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" />
             <text class="axis-label" x="${padL - 8}" y="${y + 3}" text-anchor="end">${val}</text>`;
  }).join('');

  // X-axis labels (every ~4th point)
  const step = Math.max(1, Math.floor(n / 8));
  const xLabels = allPoints.map((p, i) => {
    if (i % step !== 0 && i !== n - 1) return '';
    const d = new Date(p.date);
    const label = d.toLocaleDateString('nl-NL', { month: 'short', year: '2-digit' });
    return `<text class="axis-label" x="${xFor(i)}" y="${H - 8}" text-anchor="middle">${label}</text>`;
  }).join('');

  const nowX = xFor(forecastStartIdx);

  const historyDots = data.history.map((p, i) =>
    `<circle class="dot-history" cx="${xFor(i)}" cy="${yFor(p.value)}" r="2.5" />`
  ).join('');

  const forecastDots = data.forecast.map((p, i) =>
    `<circle class="dot-forecast" cx="${xFor(forecastStartIdx + 1 + i)}" cy="${yFor(p.value)}" r="3" />`
  ).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grafiek van historische en voorspelde trend">
      ${gridLines}
      <path class="forecast-band" d="${bandPath}" />
      <line class="now-marker" x1="${nowX}" y1="${padT}" x2="${nowX}" y2="${H - padB}" />
      <text class="now-label" x="${nowX + 6}" y="${padT + 12}">NU</text>
      <path class="history-line" d="${historyPath}" />
      <path class="forecast-line" d="${forecastPath}" />
      ${historyDots}
      ${forecastDots}
      ${xLabels}
    </svg>
  `;
}

init();
</script>
</body>
</html>
